# ==============================================================================
# Master Hardened Docker Compose Configuration
# Project: Linux System Monitoring & Reliability Lab
# Role: Agent 11 — Infrastructure Security & Deployment Engineer
#
# Production Security Principles:
# 1. Least Privilege: Explicit non-root UIDs, cap_drop: [ALL], no-new-privileges.
# 2. Immutable Runtimes: read_only: true root filesystems with minimal tmpfs.
# 3. Host Isolation: Strict 127.0.0.1 loopback port bindings preserving native
#    host services (Prometheus :9090, Grafana :3000, Node Exporter :9100).
# 4. Resource Bounds: Hard limits on CPU, memory, and PIDs to prevent DoS/OOM.
# 5. Reproducible Deployment: Exact image tags, healthchecks, and internal bridge.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Prometheus Server (Observability Core & Metric Storage)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lab-prometheus
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Bound strictly to 127.0.0.1; mapped to 9091 to prevent conflict with native :9090
      - "${HOST_BIND_IP:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - lab_prometheus_data:/prometheus
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-1.0}"
          memory: "${PROMETHEUS_MEMORY_LIMIT:-1024M}"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-monitoring-net

  # ----------------------------------------------------------------------------
  # 2. Grafana Server (Observability Visualization & Dashboards)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: lab-grafana
    restart: unless-stopped
    user: "472:472" # grafana:grafana
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Bound strictly to 127.0.0.1; mapped to 3001 to prevent conflict with native :3000
      - "${HOST_BIND_IP:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-labadmin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGEME_SECURE_GRAFANA_ADMIN_PASSWORD_MIN_16_CHARS}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - lab_grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /var/log/grafana:noexec,nosuid,size=32M
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - lab-monitoring-net

  # ----------------------------------------------------------------------------
  # 3. Alertmanager (Alert Routing, Deduplication & Dispatching)
  # ----------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lab-alertmanager
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - lab_alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:noexec,nosuid,size=32M
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-monitoring-net

  # ----------------------------------------------------------------------------
  # 4. Grafana Loki (Log Aggregation & Storage Engine)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: lab-loki
    restart: unless-stopped
    stop_grace_period: 30s
    user: "10001:10001" # loki:loki
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./loki/rules:/loki/rules:ro
      - lab_loki_data:/loki
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
    command:
      - -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lab-monitoring-net

  # ----------------------------------------------------------------------------
  # 5. Blackbox Exporter (Endpoint Availability Prober)
  # ----------------------------------------------------------------------------
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lab-blackbox-exporter
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW # Enables ICMP echo probe sockets without root privileges
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${BLACKBOX_HOST_PORT:-9115}:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      lab-monitoring-net:
        aliases:
          - blackbox-exporter

  # ----------------------------------------------------------------------------
  # 6. Grafana Alloy (Systemd Journal Collector & Log Forwarder)
  # ----------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.0.0
    container_name: lab-alloy
    restart: unless-stopped
    hostname: "${HOST_HOSTNAME:-primary-node}"
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:-primary-node}
    # Security Rationale: Process runs with primary UID 0 and primary GID 999 (root:systemd-journal).
    # Host journal files (/var/log/journal mode 0640) are owned by root:systemd-journal (GID 999).
    # Primary GID 999 provides read access to the mode 0640 journal files. UID 0 is retained strictly
    # because the persistent volume lab_alloy_data mounted at /data-alloy contains pre-existing state
    # files owned by UID 0 (0:4). Until an authorized runtime volume chown migration is performed,
    # UID 0 is required to prevent EACCES write errors during Alloy state initialization. Container
    # execution is hardened via read_only root filesystem, cap_drop: [ALL], no-new-privileges:true,
    # and read-only host mounts (/var/log/journal:ro, /run/log/journal:ro, /etc/machine-id:ro).
    user: "0:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      # Isolated loopback port mapping: Host 12345 -> Container 12345 (Alloy UI & API)
      - "${HOST_BIND_IP:-127.0.0.1}:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - lab_alloy_data:/data-alloy
    tmpfs:
      - /tmp:noexec,nosuid,size=32M
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/data-alloy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
        reservations:
          memory: "64M"
    healthcheck:
      # Native bash HTTP readiness probe (queries /-/ready without requiring wget/curl/nc)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status =~ 200 ]]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - lab-monitoring-net

networks:
  lab-monitoring-net:
    name: lab_monitoring_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  lab_prometheus_data:
    name: lab_prometheus_data
  lab_grafana_data:
    name: lab_grafana_data
  lab_alertmanager_data:
    name: lab_alertmanager_data
  lab_loki_data:
    name: lab_loki_data
  lab_alloy_data:
    name: lab_alloy_data
