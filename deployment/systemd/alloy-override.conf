# /etc/systemd/system/alloy.service.d/override.conf
# Hardened systemd sandboxing and journal access for native Grafana Alloy
# Project: Linux System Monitoring & Reliability Lab

[Service]
User=alloy
Group=alloy
SupplementaryGroups=adm systemd-journal

# Privilege Separation & Sandboxing
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
ProtectClock=yes
ProtectHostname=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes

# Empty Capability Sets (Zero Linux Capabilities)
CapabilityBoundingSet=
AmbientCapabilities=

# Explicit Filesystem Access Boundaries
ReadOnlyPaths=/var/log/journal /run/log/journal
ReadWritePaths=/var/lib/alloy

# Network Protocol Restrictions
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
