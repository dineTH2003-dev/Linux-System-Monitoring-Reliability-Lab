# Docker Compose: Blackbox Synthetic Probing Stack
# Project: Linux System Monitoring & Reliability Lab
# Principle: Isolated container deployment preserving native host services

services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lab-blackbox-exporter
    restart: unless-stopped
    ports:
      # Isolated loopback port mapping: Host 9115 -> Container 9115
      - "127.0.0.1:9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
    cap_add:
      - NET_RAW # Enables ICMP echo probe sockets without root privileges
    networks:
      - prometheus_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9115/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  prometheus_default:
    external: true
