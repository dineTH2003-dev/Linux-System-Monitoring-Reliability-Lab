# Alertmanager Configuration
# Project: Linux System Monitoring & Reliability Lab
# Role: Agent 7 (Senior SRE - Incident Detection & Alertmanager Engineering)
# Safety: Placeholder credentials only; no real secrets in source control.

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'PLACEHOLDER_SMTP_USER'
  smtp_auth_password: 'PLACEHOLDER_SMTP_PASSWORD'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-webhook'
  group_by: ['alertname', 'instance', 'subsystem']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # 1. Critical infrastructure and availability outages
    - receiver: 'pager-critical'
      matchers:
        - severity = critical
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: false

    # 2. Warning saturation, performance degradation, and trend alerts
    - receiver: 'slack-warnings'
      matchers:
        - severity = warning
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: false

    # 3. Blackbox synthetic endpoint probing alerts
    - receiver: 'blackbox-responder'
      matchers:
        - subsystem = blackbox
      group_wait: 15s
      group_interval: 3m
      repeat_interval: 2h
      continue: false

    # 4. DeadMansSwitch / Watchdog heartbeat
    - receiver: 'deadmansswitch-heartbeat'
      matchers:
        - alertname = Watchdog
      group_wait: 0s
      repeat_interval: 12h

inhibit_rules:
  # 1. Total Host failure inhibits all downstream exporter and metric alerts
  - source_matchers:
      - alertname = HostUnavailable
    target_matchers:
      - severity =~ "critical|warning"
    equal: ['instance']

  # 2. Node Exporter failure inhibits all derived hardware metric alerts
  - source_matchers:
      - alertname = NodeExporterUnavailable
    target_matchers:
      - subsystem =~ "cpu|memory|storage|disk_io|network|swap"
    equal: ['instance']

  # 3. Critical storage space exhaustion inhibits warning storage alert on same mount
  - source_matchers:
      - alertname = HostFilesystemSpaceCritical
    target_matchers:
      - alertname = HostFilesystemSpaceWarning
    equal: ['instance', 'mountpoint']

  # 4. Critical inode exhaustion inhibits warning inode alert on same mount
  - source_matchers:
      - alertname = HostInodeExhaustionCritical
    target_matchers:
      - alertname = HostInodeExhaustionWarning
    equal: ['instance', 'mountpoint']

  # 5. Critical memory exhaustion inhibits warning memory alert
  - source_matchers:
      - alertname = HostCriticalMemoryAvailable
    target_matchers:
      - alertname = HostLowMemoryAvailable
    equal: ['instance']

  # 6. Critical CPU saturation inhibits warning CPU alert
  - source_matchers:
      - alertname = HostHighCpuUtilizationCritical
    target_matchers:
      - alertname = HostHighCpuUtilizationWarning
    equal: ['instance']

  # 7. Endpoint total outage inhibits endpoint latency degradation alerts
  - source_matchers:
      - alertname = BlackboxEndpointDown
    target_matchers:
      - alertname =~ "BlackboxProbeLatencyHigh|BlackboxProbeSlowCritical|BlackboxHttpProbeFailed"
    equal: ['instance']

receivers:
  # Safe local mock webhook sink for lab development (prevents real notification spam)
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:5002/api/alerts'
        send_resolved: true

  # Critical On-Call Pager Receiver (PagerDuty placeholder)
  - name: 'pager-critical'
    pagerduty_configs:
      - routing_key: 'PLACEHOLDER_PAGERDUTY_INTEGRATION_KEY'
        send_resolved: true
        severity: 'critical'

  # Warning Receiver (Slack channel placeholder)
  - name: 'slack-warnings'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/TOKEN/HERE'
        channel: '#alerts-warning'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # Synthetic Endpoint Probing Responder
  - name: 'blackbox-responder'
    webhook_configs:
      - url: 'http://host.docker.internal:5002/api/blackbox-triage'
        send_resolved: true

  # External monitoring heartbeat receiver
  - name: 'deadmansswitch-heartbeat'
    webhook_configs:
      - url: 'https://nosnch.in/PLACEHOLDER_SNITCH_KEY'
        send_resolved: false
